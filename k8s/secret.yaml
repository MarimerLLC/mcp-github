apiVersion: v1
kind: Secret
metadata:
  name: github-mcp-secrets
  namespace: rockbot
type: Opaque
stringData:
  GitHub__AppId: "REPLACE_WITH_APP_ID"
  GitHub__InstallationId: "REPLACE_WITH_INSTALLATION_ID"
  GitHub__PrivateKeyPem: |
    -----BEGIN RSA PRIVATE KEY-----
    REPLACE_WITH_PRIVATE_KEY_PEM_CONTENTS
    -----END RSA PRIVATE KEY-----
