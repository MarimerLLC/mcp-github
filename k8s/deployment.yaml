apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-github
  namespace: rockbot
  labels:
    app: mcp-github
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-github
  template:
    metadata:
      labels:
        app: mcp-github
    spec:
      containers:
        - name: mcp-github
          image: rockylhotka/mcp-github:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: GitHub__AppId
              valueFrom:
                secretKeyRef:
                  name: github-mcp-secrets
                  key: GitHub__AppId
            - name: GitHub__InstallationId
              valueFrom:
                secretKeyRef:
                  name: github-mcp-secrets
                  key: GitHub__InstallationId
            - name: GitHub__PrivateKeyPem
              valueFrom:
                secretKeyRef:
                  name: github-mcp-secrets
                  key: GitHub__PrivateKeyPem
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
